components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: buzon_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: *id003
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 120
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: *id003
        message: *id003
        correlation_id: *id001
      required:
      - code
      - message
      - correlation_id
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        full_name: *id003
        role:
          type: string
          enum:
          - USUARIO
          - OPERADOR
          - ADMIN
          - AUDITOR
        contact_verified:
          type: boolean
      required:
      - id
      - full_name
      - role
      - contact_verified
    Register:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        full_name: *id003
        phone: *id003
      required:
      - email
      - password
      - full_name
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires_at: *id002
      required:
      - user
      - expires_at
    Csrf:
      type: object
      additionalProperties: false
      properties:
        csrf_token: *id003
      required:
      - csrf_token
    TokenAction:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    ResetRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResetComplete:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - token
      - password
    Reason:
      type: object
      additionalProperties: false
      properties:
        reason: *id003
      required:
      - reason
    VersionReason:
      type: object
      additionalProperties: false
      properties:
        reason: *id003
        expected_version: &id005
          type: integer
          minimum: 1
      required:
      - reason
      - expected_version
    Point:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id003
        address: *id003
        opening_hours:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
      required:
      - id
      - name
      - address
      - opening_hours
      - is_active
    CustodyCreate:
      type: object
      additionalProperties: false
      properties:
        recipient_contact: *id003
        point_id: *id001
        description:
          type: string
          maxLength: 255
        size_category: *id004
      required:
      - recipient_contact
      - point_id
      - description
      - size_category
    Custody:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        tracking_number: *id003
        state: &id006
          type: string
