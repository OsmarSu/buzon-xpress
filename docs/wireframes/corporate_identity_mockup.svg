<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img">
<title>Identidad: confianza sustentada en el proceso</title><desc>Propuesta estática con datos ficticios. Custodia asistida, sin hardware externo.</desc>
<style>text{font-family:DejaVu Sans,sans-serif} .bold{font-weight:700}</style>
<rect x="0" y="0" width="1440" height="1180" rx="0" fill="#F4F6FA" stroke="none"/>
<rect x="0" y="0" width="1440" height="108" rx="0" fill="#0B368C" stroke="none"/>
<text x="40" y="46" font-size="27" fill="#FFFFFF" class="bold">BUZON Xpress</text>
<text x="40" y="82" font-size="17" fill="#FFFFFF">Identidad: confianza sustentada en el proceso</text>
<text x="40" y="1154" font-size="13" fill="#444444">DISEÑO ESTÁTICO · DATOS DE EJEMPLO · ATENCIÓN POR PERSONAL · SIN DISPOSITIVOS EXTERNOS</text>
<rect x="40" y="145" width="1360" height="210" rx="12" fill="#FFFFFF" stroke="#CBD2DF"/>
<text x="62" y="181" font-size="20" fill="#172033" class="bold">BUZON Xpress · Tu entrega, a su tiempo</text>
<text x="65" y="220" font-size="30" fill="#0B368C" class="bold">Servicio de custodia temporal asistida e intercambio</text>
<text x="65" y="264.4" font-size="30" fill="#0B368C" class="bold">asíncrono de objetos.</text>
<rect x="40" y="395" width="325" height="125" rx="12" fill="#0B368C" stroke="#AAB2C0"/>
<text x="52" y="549" font-size="18" fill="#172033" class="bold">#0B368C</text>
<text x="52" y="582" font-size="16" fill="#172033">Marca y navegación</text>
<rect x="385" y="395" width="325" height="125" rx="12" fill="#D91438" stroke="#AAB2C0"/>
<text x="397" y="549" font-size="18" fill="#172033" class="bold">#D91438</text>
<text x="397" y="582" font-size="16" fill="#172033">Acción principal</text>
<rect x="730" y="395" width="325" height="125" rx="12" fill="#172033" stroke="#AAB2C0"/>
<text x="742" y="549" font-size="18" fill="#172033" class="bold">#172033</text>
<text x="742" y="582" font-size="16" fill="#172033">Texto</text>
<rect x="1075" y="395" width="325" height="125" rx="12" fill="#F4F6FA" stroke="#AAB2C0"/>
<text x="1087" y="549" font-size="18" fill="#172033" class="bold">#F4F6FA</text>
<text x="1087" y="582" font-size="16" fill="#172033">Fondo</text>
<rect x="40" y="620" width="660" height="270" rx="12" fill="#FFFFFF" stroke="#CBD2DF"/>
<text x="62" y="656" font-size="20" fill="#172033" class="bold">Misión propuesta</text>
<text x="65" y="700" font-size="22" fill="#172033">Facilitar intercambios de objetos mediante</text>
<text x="65" y="732.56" font-size="22" fill="#172033">custodia atendida, verificación y</text>
<text x="65" y="765.1199999999999" font-size="22" fill="#172033">constancia digital.</text>
<rect x="730" y="620" width="670" height="270" rx="12" fill="#FFFFFF" stroke="#CBD2DF"/>
<text x="752" y="656" font-size="20" fill="#172033" class="bold">Compromisos operativos</text>
<text x="755" y="700" font-size="20" fill="#172033">• Condiciones antes de recibir.</text>
<text x="755" y="737" font-size="20" fill="#172033">• Constancia de cada movimiento.</text>
<text x="755" y="774" font-size="20" fill="#172033">• Verificación antes de entregar.</text>
<text x="755" y="811" font-size="20" fill="#172033">• Responsable ante diferencias.</text>
<rect x="40" y="930" width="1360" height="130" rx="12" fill="#EDF2FC" stroke="#CBD2DF"/>
<text x="65" y="975" font-size="21" fill="#172033">El horario acompaña la promesa de marca. La evidencia proviene de operadores y registros; el</text>
<text x="65" y="1006.08" font-size="21" fill="#172033">sistema no controla físicamente el almacenamiento.</text>
</svg>